<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}
.w{stroke:#111;stroke-width:4;fill:none}
.c{stroke:#111;stroke-width:4;fill:white}
.t{font-size:22px}
.h{font-size:28px;font-weight:700}
.s{font-size:19px}
</style>
<rect width="1200" height="650" fill="white"/>
<text x="600" y="45" text-anchor="middle" class="h">Dual µA741 Resistance-to-Voltage Converter</text>

<!-- Stage 1 opamp -->
<polygon class="c" points="350,210 350,390 540,300"/>
<text x="410" y="310" class="t">µA741</text>
<text x="330" y="255" class="t">−</text>
<text x="330" y="365" class="t">+</text>
<text x="445" y="195" class="s">±15 V</text>

<!-- Vs1 input -->
<circle class="c" cx="100" cy="250" r="36"/>
<text x="100" y="255" text-anchor="middle" class="s">1.5 V</text>
<path class="w" d="M136 250 H190"/>
<path class="w" d="M190 250 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18 H350"/>
<text x="270" y="215" text-anchor="middle" class="s">1 kΩ</text>

<!-- noninv ground -->
<path class="w" d="M350 355 H295"/>
<path class="w" d="M295 355 l-18 18 l36 18 l-36 18 l36 18 l-18 18 V500"/>
<line class="w" x1="270" y1="500" x2="320" y2="500"/>
<line class="w" x1="278" y1="512" x2="312" y2="512"/>
<line class="w" x1="287" y1="524" x2="303" y2="524"/>
<text x="245" y="420" class="s">1 kΩ</text>

<!-- Rs feedback -->
<path class="w" d="M540 300 H590 V125 H350 V210"/>
<path class="w" d="M400 125 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18"/>
<text x="475" y="92" text-anchor="middle" class="s">Rs = 250…800 Ω</text>

<text x="565" y="285" class="t">Vo1</text>

<!-- Stage 2 opamp -->
<polygon class="c" points="830,210 830,390 1020,300"/>
<text x="890" y="310" class="t">µA741</text>
<text x="810" y="255" class="t">−</text>
<text x="810" y="365" class="t">+</text>
<text x="925" y="195" class="s">±15 V</text>

<!-- Vo1 to R1 -->
<path class="w" d="M590 300 H640"/>
<path class="w" d="M640 300 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18 H830"/>
<text x="735" y="265" text-anchor="middle" class="s">R1 = 515.625 Ω</text>

<!-- Vs2 + R2 into summing node -->
<circle class="c" cx="640" cy="475" r="36"/>
<text x="640" y="480" text-anchor="middle" class="s">5 V</text>
<path class="w" d="M676 475 H720"/>
<path class="w" d="M720 475 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18 H790 V300 H830"/>
<text x="820" y="445" text-anchor="middle" class="s">R2 ≈ 3.274 kΩ</text>

<!-- Stage2 plus grounded -->
<path class="w" d="M830 355 H785 V500"/>
<line class="w" x1="760" y1="500" x2="810" y2="500"/>
<line class="w" x1="768" y1="512" x2="802" y2="512"/>
<line class="w" x1="777" y1="524" x2="793" y2="524"/>

<!-- feedback 10k -->
<path class="w" d="M1020 300 H1080 V125 H830 V210"/>
<path class="w" d="M890 125 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18"/>
<text x="950" y="92" text-anchor="middle" class="s">10 kΩ feedback</text>

<!-- output -->
<path class="w" d="M1020 300 H1140"/>
<text x="1090" y="280" class="t">Vo2</text>

<text x="440" y="590" text-anchor="middle" class="t">Stage 1: inverting amplifier</text>
<text x="920" y="590" text-anchor="middle" class="t">Stage 2: inverting summing amplifier</text>
</svg>